<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handwritten Digit Recognizer - ML Demo</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Josefin Sans", sans-serif;
        background: linear-gradient(135deg, #0a0a23 0%, #1a1a4e 100%);
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 40px;
        max-width: 560px;
        width: 100%;
        backdrop-filter: blur(8px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        text-align: center;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }
      h1 span {
        color: #f9004d;
      }
      .subtitle {
        color: #fcfc;
        margin-bottom: 25px;
        font-weight: 300;
      }
      #canvas {
        background: #fff;
        border-radius: 12px;
        cursor: crosshair;
        touch-action: none;
        border: 2px solid rgba(255, 255, 255, 0.2);
        max-width: 100%;
      }
      .result {
        margin-top: 20px;
        font-size: 20px;
        font-weight: 600;
        min-height: 30px;
      }
      .result span {
        color: #00bfff;
        font-size: 40px;
      }
      .confidence {
        font-size: 14px;
        color: #fcfc;
        font-weight: 400;
        margin-top: 4px;
      }
      .buttons {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }
      button {
        flex: 1;
        padding: 14px;
        background: #f9004d;
        color: #fff;
        border: 2px solid transparent;
        border-radius: 30px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: inherit;
      }
      button:hover {
        background: transparent;
        border-color: #f9004d;
        color: #f9004d;
        transform: translateY(-2px);
      }
      button.secondary {
        background: transparent;
        border-color: #00bfff;
        color: #00bfff;
      }
      button.secondary:hover {
        background: #00bfff;
        color: #fff;
      }
      .examples {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .examples p {
        font-size: 13px;
        color: #fcfc;
        margin-bottom: 8px;
      }
      .example-btn {
        display: inline-block;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ddd;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        cursor: pointer;
        margin: 4px;
        transition: all 0.3s ease;
        font-family: inherit;
      }
      .example-btn:hover {
        background: #00bfff;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Digit <span>Recognizer</span></h1>
      <p class="subtitle">CNN image classification — draw a digit (0-9)</p>

      <canvas id="canvas" width="280" height="280"></canvas>

      <div class="result">Prediction: <span id="result">?</span></div>
      <div class="confidence" id="confidence"></div>

      <div class="buttons">
        <button onclick="analyze()">Predict</button>
        <button class="secondary" onclick="clearCanvas()">Clear</button>
      </div>

      <div class="examples">
        <p>Draw a digit, then click Predict.</p>
      </div>
    </div>

    <script src="demo.js"></script>
  </body>
</html>
