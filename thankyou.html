<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Siddhanth S</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
            --bg: #030014;
            --cyan: #00f0ff;
            --pink: #ff007f;
            --purple: #7f00ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: #ffffff;
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: -1;
        }
        .cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(127, 0, 255, 0.25) 0%, rgba(0, 240, 255, 0.1) 40%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
            mix-blend-mode: screen;
        }
        .card {
            max-width: 520px;
            padding: 60px 44px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            z-index: 1;
        }
        .emoji {
            font-size: 60px;
            margin-bottom: 20px;
            animation: floating 3s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes floating {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
        .card h1 {
            font-family: var(--font-heading);
            font-size: 38px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff007f, #7f00ff, #00f0ff, #ff007f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 6s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card p {
            color: #9ca3af;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            padding: 13px 32px;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(90deg, #ff007f, #00f0ff);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="cursor-glow" id="cursor"></div>

    <div class="card">
        <div class="emoji">🎉</div>
        <h1>Thank You!</h1>
        <p>Your message has been sent successfully. I'll get back to you as soon as possible.</p>
        <a class="btn" href="index.html">Back to Home</a>
    </div>

    <script>
        const c = document.getElementById('cursor');
        window.addEventListener('mousemove', (e) => {
            c.style.left = e.clientX + 'px';
            c.style.top = e.clientY + 'px';
        });

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            init();
        });

        class P {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.r = Math.random() * 2 + 1;
                this.a = Math.random() * 0.5 + 0.2;
                this.col = Math.random() > 0.5 ? '#00f0ff' : '#ff007f';
            }
            u() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
            }
            d() {
                ctx.save();
                ctx.globalAlpha = this.a;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = this.col;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.col;
                ctx.fill();
                ctx.restore();
            }
        }

        let parts = [];
        function init() {
            parts = [];
            const n = Math.floor((w * h) / 20000);
            for (let i = 0; i < n; i++) parts.push(new P());
        }
        function loop() {
            ctx.clearRect(0, 0, w, h);
            for (let i = 0; i < parts.length; i++) {
                for (let j = i + 1; j < parts.length; j++) {
                    const dx = parts[i].x - parts[j].x;
                    const dy = parts[i].y - parts[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.save();
                        ctx.globalAlpha = (1 - dist / 120) * 0.15;
                        ctx.strokeStyle = '#7f00ff';
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(parts[i].x, parts[i].y);
                        ctx.lineTo(parts[j].x, parts[j].y);
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }
            parts.forEach(p => { p.u(); p.d(); });
            requestAnimationFrame(loop);
        }
        init();
        loop();
    </script>
</body>
</html>
